# developers.sedumo.com: deployed on every push to main, and every hour when Sedumo's manual has changed since the
# last deploy (the guides are the manual). Only this repo's own pushes and schedule run it, never a pull request.
name: Deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch Sedumo's manual
        env:
          SEDUMO_DOCS_KEY: ${{ secrets.SEDUMO_DOCS_KEY }}
          SEDUMO_DOCS_REPO: ${{ vars.SEDUMO_DOCS_REPO }}
          SEDUMO_DOCS_PATH: ${{ vars.SEDUMO_DOCS_PATH }}
        run: bash scripts/fetch-manual.sh --required
      # On the hourly run, deploy only when this commit hasn't been deployed with this version of the manual.
      - id: seen
        uses: actions/cache/restore@v4
        with:
          path: .deployed
          key: deployed-${{ github.sha }}-${{ env.SEDUMO_DOCS_VERSION }}
          lookup-only: true
      - if: github.event_name != 'schedule' || steps.seen.outputs.cache-hit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: github.event_name != 'schedule' || steps.seen.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm run guides
          npm test
          npm run build:cloudflare
          npx wrangler deploy
          # The examples' token, as the Worker's secret (never in the code or the log).
          printf '%s' "$SEDUMO_TOKEN" | npx wrangler secret put SEDUMO_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SEDUMO_TOKEN: ${{ secrets.SEDUMO_TOKEN }}
      - if: github.event_name != 'schedule' || steps.seen.outputs.cache-hit != 'true'
        run: mkdir -p .deployed && echo "$SEDUMO_DOCS_VERSION" > .deployed/manual
      - if: github.event_name != 'schedule' || steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deployed
          key: deployed-${{ github.sha }}-${{ env.SEDUMO_DOCS_VERSION }}
