# Every pull request and push: types, tests and both builds. Sedumo's manual is fetched when the repo has the key to
# read it (SEDUMO_DOCS_KEY); a pull request from a copy of this repo builds without the guides, as a copy does.
name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fetch Sedumo's manual
        env:
          SEDUMO_DOCS_KEY: ${{ secrets.SEDUMO_DOCS_KEY }}
          SEDUMO_DOCS_REPO: ${{ vars.SEDUMO_DOCS_REPO }}
          SEDUMO_DOCS_PATH: ${{ vars.SEDUMO_DOCS_PATH }}
        run: bash scripts/fetch-manual.sh
      - run: npm ci
      - run: npm run guides
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:cloudflare
  # The code the examples show, in every language but ABAP: each program runs and must send exactly the page's request
  # (scripts/run-code.ts, against a local server; no token needed).
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: python3 --version && php --version | head -1
      - run: node scripts/run-code.ts
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
