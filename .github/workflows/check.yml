# Every pull request and push: types, tests and both builds. Sedumo's manual is fetched when the repo has the key to
# read it (SEDUMO_DOCS_KEY); a pull request from a copy of this repo builds without the guides, as a copy does.
name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fetch Sedumo's manual
        env:
          SEDUMO_DOCS_KEY: ${{ secrets.SEDUMO_DOCS_KEY }}
          SEDUMO_DOCS_REPO: ${{ vars.SEDUMO_DOCS_REPO }}
          SEDUMO_DOCS_PATH: ${{ vars.SEDUMO_DOCS_PATH }}
        run: bash scripts/fetch-manual.sh
      - run: npm ci
      - run: npm run guides
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:cloudflare
  # The code the examples show, in every language that runs on its own: each program must send exactly the page's
  # request (scripts/run-code.ts, against a local server), then print on Sedumo when the repo has a token for it (a
  # pull request from a copy of this repo gets none and runs the local check only).
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer push to the same branch cancels the older run, so its prints aren't sent twice.
    concurrency:
      group: code-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: python3 --version && php --version | head -1
      - name: Each program sends the page's request (local)
        run: node scripts/run-code.ts --only=local
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
      # Only with both the token and its address: a token never goes to another Sedumo.
      - name: Each program prints on Sedumo
        if: ${{ vars.SEDUMO_STAGING_API_URL != '' }}
        run: |
          if [ -z "$SEDUMO_TOKEN" ]; then echo 'No token for Sedumo here (a pull request from a copy of this repo): skipped'; exit 0; fi
          node scripts/run-code.ts --only=sedumo
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          SEDUMO_TOKEN: ${{ secrets.SEDUMO_STAGING_TOKEN }}
          SEDUMO_API_URL: ${{ vars.SEDUMO_STAGING_API_URL }}
